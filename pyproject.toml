[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapeunblocker"
version = "0.1.6"
description = "Official Python client for the ScrapeUnblocker web scraping API - JS-rendered pages that bypass Cloudflare, DataDome, PerimeterX and Akamai, plus Google SERP and Skyscanner flights/hotels/car-hire scraping as JSON."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "ScrapeUnblocker", email = "support@scrapeunblocker.com" }]
keywords = [
    "web scraping",
    "scraping api",
    "anti-bot",
    "proxy",
    "cloudflare",
    "datadome",
    "captcha",
    "crawler",
    "scraper",
    "skyscanner",
    "skyscanner scrape",
    "skyscanner scrape api",
    "skyscanner scraper",
    "skyscanner api",
    "scrape skyscanner",
    "flights api",
    "hotels api",
    "car hire",
    "travel data",
    "serp api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23"]

[project.urls]
Homepage = "https://scrapeunblocker.com?utm_source=pypi&utm_medium=integration&utm_campaign=python-sdk"
Documentation = "https://developers.scrapeunblocker.com?utm_source=pypi&utm_medium=integration&utm_campaign=python-sdk"
Source = "https://github.com/ScrapeUnblocker/scrapeunblocker-python"
Changelog = "https://github.com/ScrapeUnblocker/scrapeunblocker-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20", "mypy>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/scrapeunblocker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
